# Kadri API Worker.
#
# One-time setup (done by a human after `npx wrangler login`):
#   npx wrangler d1 create kadri-dev
#   npx wrangler d1 create kadri-staging
#   npx wrangler d1 create kadri-prod
#     → paste each printed database_id below.
#   npx wrangler r2 bucket create kadri-photos-dev
#   npx wrangler r2 bucket create kadri-photos-staging
#   npx wrangler r2 bucket create kadri-photos-prod
#   for each env (--env staging / --env production):
#     npx wrangler secret put OPENAI_API_KEY --env <env>
#     npx wrangler secret put GEMINI_API_KEY --env <env>
#     npx wrangler secret put SESSION_SECRET --env <env>
#     npx wrangler secret put GOOGLE_CLIENT_IDS --env <env>
# Local dev reads secrets from .dev.vars (see .dev.vars.example).

name = "kadri-worker"
account_id = "25aa804574d6b37776f86ab4a6333ad5"
main = "src/index.ts"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]

[vars]
AI_PROVIDER = "astra"
ENVIRONMENT = "dev"
ALLOW_PROVIDER_SELECTION = "true"
KNOWLEDGE_HUB_ENABLED = "false"
DAILY_SESSION_LIMIT = "20"
AI_TIMEOUT_MS = "60000"
AI_ATTEMPT_TIMEOUT_MS = "20000"
AI_FIRST_STEP_TIMEOUT_MS = "25000"
ANSWER_TURN_LIMIT = "6"

[[d1_databases]]
binding = "DB"
database_name = "kadri-dev"
database_id = "TODO-set-after-wrangler-d1-create"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "kadri-photos-dev"

[env.staging]
name = "kadri-worker-staging"

[env.staging.vars]
AI_PROVIDER = "astra"
ENVIRONMENT = "staging"
ALLOW_PROVIDER_SELECTION = "true"
KNOWLEDGE_HUB_ENABLED = "true"
KNOWLEDGE_HUB_URL = "https://knowledge-hub-mcp.onrender.com/mcp"
# Raised for hands-on testing; production keeps 20.
DAILY_SESSION_LIMIT = "1000"
AI_TIMEOUT_MS = "60000"
AI_ATTEMPT_TIMEOUT_MS = "20000"
AI_FIRST_STEP_TIMEOUT_MS = "25000"
ANSWER_TURN_LIMIT = "6"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "kadri-staging"
database_id = "3857740b-3d9a-4738-aaa8-14e7d8573789"

[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "kadri-photos-staging"

[env.production]
name = "kadri-worker-prod"

[env.production.vars]
AI_PROVIDER = "astra"
ENVIRONMENT = "production"
ALLOW_PROVIDER_SELECTION = "false"
KNOWLEDGE_HUB_ENABLED = "false"
DAILY_SESSION_LIMIT = "20"
AI_TIMEOUT_MS = "60000"
AI_ATTEMPT_TIMEOUT_MS = "20000"
AI_FIRST_STEP_TIMEOUT_MS = "25000"
ANSWER_TURN_LIMIT = "6"

[[env.production.d1_databases]]
binding = "DB"
database_name = "kadri-prod"
database_id = "TODO-set-after-wrangler-d1-create"

[[env.production.r2_buckets]]
binding = "PHOTOS"
bucket_name = "kadri-photos-prod"
