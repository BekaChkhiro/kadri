name: Kadri
options:
  bundleIdPrefix: ge.kadri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  KadriCore:
    path: Packages/KadriCore
targets:
  Kadri:
    type: application
    platform: iOS
    sources:
      - path: Kadri
    dependencies:
      - package: KadriCore
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: Vision.framework
      - sdk: CoreML.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ge.kadri.app
        PRODUCT_NAME: Kadri
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Kadri/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: კადრი
        INFOPLIST_KEY_NSCameraUsageDescription: კადრი კამერას იყენებს ობიექტის დასანახად და ინსტრუქციის საჩვენებლად
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  KadriTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KadriTests
    dependencies:
      - target: Kadri
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ge.kadri.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kadri:
    build:
      targets:
        Kadri: all
        KadriTests: [test]
    test:
      targets:
        - KadriTests
        - package: KadriCore/KadriCoreTests
