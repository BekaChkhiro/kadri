name: Kadri
options:
  bundleIdPrefix: ge.kadri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: M49DJ3634D
    CODE_SIGN_STYLE: Automatic
packages:
  KadriCore:
    path: Packages/KadriCore
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
targets:
  Kadri:
    type: application
    platform: iOS
    sources:
      - path: Kadri
      - path: Models/SAMEncoder.mlpackage
      - path: Models/SAMDecoder.mlpackage
      - path: Models/SAMDecoderPoint.mlpackage
      - path: KadriTests/Fixtures/sink
        type: folder
        buildPhase: resources
    dependencies:
      - package: KadriCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: Vision.framework
      - sdk: CoreML.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ge.kadri.app
        PRODUCT_NAME: Kadri
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Kadri/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: NETA
        INFOPLIST_KEY_NSCameraUsageDescription: NETA კამერას იყენებს ობიექტის დასანახად და ინსტრუქციის საჩვენებლად
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        COREML_CODEGEN_LANGUAGE: None
        # Read through Info.plist ($(…) substitution) by APIConfig.fromBundle and GIDSignIn.
        # Release points at staging too until a production Worker exists.
        KADRI_API_URL: https://kadri-worker-staging.bekachkhirodze1.workers.dev
        GID_CLIENT_ID: 366519256518-6oboqijftm0mbqct40tuogm36bnlt498.apps.googleusercontent.com
        GID_SERVER_CLIENT_ID: 366519256518-17h7nfvfreh6c0nb8lt0mp74uskogfkl.apps.googleusercontent.com
        GID_URL_SCHEME: com.googleusercontent.apps.366519256518-6oboqijftm0mbqct40tuogm36bnlt498
  KadriTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KadriTests
        excludes:
          - Fixtures/**
      - path: KadriTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Kadri
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ge.kadri.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kadri:
    build:
      targets:
        Kadri: all
        KadriTests: [test]
    test:
      targets:
        - KadriTests
        - package: KadriCore/KadriCoreTests
